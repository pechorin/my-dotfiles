# Draft workstation configuration. Nothing has been applied.
# Reference schema: mise v2026.11.5, saved as mise.schema.json.
min_version = "2026.11.5"

[settings]
auto_install = false
idiomatic_version_file_enable_tools = ["ruby", "node", "python", "go", "rust"]

[tools]
# Observed ~/.rbenv/version; project .ruby-version takes precedence.
ruby = "3.4.7"
# Original installers did not pin these versions; requests remain floating.
node = "lts"
python = "latest"
go = "latest"
rust = { version = "stable", profile = "default", components = ["rust-src", "rust-analyzer"] }
"go:golang.org/x/tools/gopls" = "latest"
"gem:solargraph" = "latest"
"gem:neovim" = "latest"
"npm:vim-language-server" = "latest"
"npm:basedpyright" = "latest"
"npm:prettier" = "latest"
"npm:@fsouza/prettierd" = "latest"
"pypi:black" = "latest"
"pypi:isort" = "latest"

[env]
HOST = "localhost"
EDITOR = "nvim"
GOPATH = "{{ env.HOME }}/go"
ZSH_CACHE_DIR = "{{ env.HOME }}/.tmp/zsh"
# Personal binaries and existing vendor installations; no installation implied.
_.path = [
  "{{ env.HOME }}/.local/bin",
  "/opt/homebrew/opt/postgresql@15/bin",
  "/opt/homebrew/opt/libpq/bin",
  "/opt/homebrew/opt/openjdk/bin",
  "{{ env.HOME }}/.local/opt/protobuf-2.6/bin",
  "/opt/cprocsp/bin", "/opt/cprocsp/sbin",
  "{{ env.HOME }}/go/bin",
  "{{ env.HOME }}/.docker/bin",
  "{{ env.HOME }}/.opencode/bin",
  "{{ env.HOME }}/.minimax-code/bin",
  "{{ env.HOME }}/.minimax/bin",
]

[bootstrap.brew]
adopt = true

# Declarative equivalents of the three defaults writes in install_osx.
[bootstrap.macos.defaults.NSGlobalDomain]
ApplePressAndHoldEnabled = false
InitialKeyRepeat = 10
KeyRepeat = 1

# Individual files only: never replace ~/.vim or its installed plugins.
[dotfiles]
"~/.zprofile" = { source = ".zprofile", mode = "symlink" }
"~/.zshrc" = { source = ".zshrc", mode = "symlink" }
"~/.zsh_plugins.txt" = { source = ".zsh_plugins.txt", mode = "symlink" }
"~/.gitconfig" = { source = ".gitconfig", mode = "symlink" }
"~/.vimrc" = { source = "vim/.vimrc", mode = "symlink" }
"~/.ctags" = { source = "vim/.ctags", mode = "symlink" }
"~/.config/nvim/init.vim" = { source = "vim/init.vim", mode = "symlink" }
"~/.vim/colors/bclear.vim" = { source = "vim/bclear.vim", mode = "symlink" }
"~/.vim/colors/macvim.vim" = { source = "vim/macvim.vim", mode = "symlink" }

# Packages: original dotfiles plus the installed workstation inventory (2026-11-09).
[bootstrap.packages]

